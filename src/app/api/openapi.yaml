openapi: 3.0.3
info:
  title: Clean Angular Architecture API
  version: 1.0.0
paths:
  /users:
    get:
      operationId: listUsers
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
  /products:
    get:
      operationId: listProducts
      responses:
        '200':
          description: Products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
components:
  schemas:
    User:
      type: object
      required: [id, firstName, lastName, email, role]
      properties:
        id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        role:
          type: string
    Product:
      type: object
      required: [id, name, sku, price, description]
      properties:
        id:
          type: string
        name:
          type: string
        sku:
          type: string
        price:
          type: number
        description:
          type: string
